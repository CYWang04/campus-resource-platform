name: Foundation checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node --test scripts/test-slots.test.mjs
      - run: npm ci && npm run build
        working-directory: web
      - run: pwsh -File scripts/init-local.ps1
      - name: Build and start the application
        run: |
          if ! docker compose --env-file .env -f infra/compose.yml up --build -d --wait; then
            docker compose --env-file .env -f infra/compose.yml ps --all
            docker compose --env-file .env -f infra/compose.yml logs --no-color mysql
            exit 1
          fi
        env:
          COMPOSE_PARALLEL_LIMIT: '1'
      - run: node scripts/smoke.mjs
      - run: node scripts/m1-regression.mjs
      - run: node scripts/resilience.mjs
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yml down
