server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  location /internal/ { return 404; }
  location /actuator/ { return 404; }
  location /api/v1/auth/ { proxy_pass http://m2:8080; }
  location /api/v1/directory/ { proxy_pass http://m2:8080; }
  location /api/v1/system/m1/ { proxy_pass http://m1:8080; }
  location /api/v1/system/m2/ { proxy_pass http://m2:8080; }
  location /api/v1/rooms { proxy_pass http://m1:8080; }
  location /api/v1/reservations { proxy_pass http://m1:8080; }
  location /api/v1/admin/rooms { proxy_pass http://m1:8080; }
  location /api/v1/admin/seats { proxy_pass http://m1:8080; }
  location /api/v1/admin/reservation-statistics { proxy_pass http://m1:8080; }
  location /api/v1/room-applications { proxy_pass http://m2:8080; }
  location /api/v1/ { proxy_pass http://m3:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
